name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The port collision this prevents (2026-08-06): a push to `develop` fires the push trigger AND the
# pull_request trigger of the open develop->main PR, so the IDENTICAL commit runs twice in parallel.
# Both spin up the qualification's echo/HTTP/TLS peers, which bind FIXED ports (39187-39191) because
# the STARK consumer packages hardcode those addresses in their source — so the peers cannot simply
# take an ephemeral port, and retrying on a different one would leave the consumer connecting to the
# wrong place. Two runs therefore raced and one failed with `[Errno 98] Address already in use` on a
# commit its sibling run proved green.
#
# Grouping by the tested COMMIT rather than the ref is what makes this work: the push and
# pull_request events carry the same sha, so they land in one group and queue instead of racing.
# `cancel-in-progress: false` queues rather than cancels, so both events still report — the goal is
# to stop them overlapping, not to drop a result someone is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: fmt, clippy, test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      # Commands match the C3-ENTRY mandatory CI baseline (COMPILER-ROADMAP.md, C3-ENTRY
      # section) — the full-featured forms, not the narrower charter §2.5 defaults.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        # `--no-fail-fast` is load-bearing, not tidiness. Without it cargo stops at the FIRST
        # failing test binary, so a run can only ever report one broken target -- which turned a
        # single behaviour change into five serial push/CI round-trips, each surfacing the next
        # stale test. With it, one run lists every failure across all three platforms at once.
        run: cargo test --workspace --all-targets --all-features --no-fail-fast
      - name: Execution snapshot verification (C3-ENTRY baseline)
        run: cargo test --test exec_snapshots
      - name: Release package structure and installer tests
        run: python scripts/test_build_release.py

  # WP-C6.4c (§10.4): the Tier-1 platform qualification record.
  #
  # This deliberately re-runs commands `build-and-test` already covers, which §10.4 otherwise
  # discourages. The reason: `build-and-test` is the broad net across three platforms and proves
  # the tree is green; a C6.4 evidence record has to be SELF-CONTAINED — its own commands, its own
  # counts, its own measured platform identity, at one named commit — because that record is what a
  # Gate C6 claim rests on. Reading counts out of another job's logs would make the claim depend on
  # log scraping rather than on an artifact. Both jobs run in parallel, so the wall clock is
  # unchanged.
  #
  # Tier-1 only. Windows is Tier-2 and gets a gap report (`c64-windows-gap`), never a
  # qualification record — §36, and Review D question 12: green Windows CI must not be mistakable
  # for Tier-1 qualification.
  c64-qualification:
    name: C6.4 tier-1 qualification (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: Qualification run
        run: |
          python3 scripts/run-c64-qualification.py \
            --expected-target ${{ matrix.triple }} \
            --commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/c64-evidence"
      # Uploaded even on failure: a failed qualification is evidence too, and §12.4(5) asks for
      # artifacts to survive the failure that makes them worth reading.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/c64-evidence/

  # WP-C6.5 §16.1: the corpus's own Tier-1 jobs. Separate from `c64-qualification` because they
  # produce a DIFFERENT artifact — a corpus record with per-case observation hashes — and because a
  # corpus failure should be readable as such rather than as one red step inside a platform record.
  #
  # The C6.4 qualification job also runs the corpus commands (§16.5, for row 24); this job is what
  # produces the machine-readable corpus evidence the Tier-1 corpus comparison consumes.
  c65-corpus:
    name: C6.5 corpus replay (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: Corpus integrity
        run: |
          python3 tests/c6-corpus/generate.py --check
          cargo test --test c6_corpus_manifest --test c6_corpus_generator
      - name: Full corpus replay
        env:
          C6_EVIDENCE_DIR: ${{ runner.temp }}/c65-evidence
        run: cargo test --test c6_generated_corpus -- --nocapture
      - name: Metamorphic families
        env:
          C6_EVIDENCE_DIR: ${{ runner.temp }}/c65-evidence
        run: cargo test --test c6_metamorphic
      - name: Package breadth
        env:
          C6_EVIDENCE_DIR: ${{ runner.temp }}/c65-evidence
        run: cargo test --test c6_package
      - name: Name the record by platform
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/c65-evidence"
          if [ -f "$RUNNER_TEMP/c65-evidence/summary.json" ]; then
            mv "$RUNNER_TEMP/c65-evidence/summary.json" \
               "$RUNNER_TEMP/c65-evidence/${{ matrix.name }}-summary.json"
            mv "$RUNNER_TEMP/c65-evidence/per-case.json" \
               "$RUNNER_TEMP/c65-evidence/${{ matrix.name }}-per-case.json"
          fi
      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c65-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/c65-evidence/

  # §14: the mutation controls, as their own job. They are the negative control for every other
  # claim here, so a run where they were skipped must be visibly different from one where they
  # passed — a step inside another job would not be.
  c65-mutation-controls:
    name: C6.5 mutation controls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: Mutation controls
        env:
          C6_EVIDENCE_DIR: ${{ runner.temp }}/c65-mutations
        run: cargo test --test c6_mutation -- --nocapture
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c65-mutation-evidence
          path: ${{ runner.temp }}/c65-mutations/

  # DEV-160: the raw slot primitives, under Miri.
  #
  # `ValueSlot::field_ref_raw` and its siblings take a `*mut ValueSlot<T>` and hand back a borrow of
  # one field while a SIBLING is moved out. Ordinary tests cannot tell a sound raw projection from
  # one that merely happens to work: nothing in a normal run checks provenance or Stacked Borrows.
  # Miri does, and it is the only thing here that does.
  #
  # It also covers a hand-written copy of a GENERATED thunk (`slot::tests::thunk`). Miri cannot run
  # what the backend has not generated, so the shape is written out for it — and
  # `dev160_call_site_thunk::the_miri_fixture_matches_what_the_generator_emits`, in the ordinary test
  # job, fails if that copy stops matching what the compiler emits. Neither check is worth much
  # without the other.
  #
  # **Pinned, not `nightly`.** Miri's aliasing model is under active development; a floating nightly
  # would turn "our raw projections are sound" into "they are sound under whatever model shipped
  # this morning", and a failure would be unattributable between our change and theirs. Moving the
  # pin is a deliberate act with its own commit.
  #
  # `-Zmiri-ignore-leaks` is needed and is not a weakening of the aliasing check. Three `should_panic`
  # tests hold heap values when the panic aborts them, which Miri reports as leaked memory; that is
  # what those tests are for. Provenance checking stays strict.
  dev160-miri:
    name: DEV-160 raw slot primitives under Miri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      # `+nightly-...` is LOAD-BEARING and cannot be dropped. `starkc/rust-toolchain.toml` pins
      # `channel = "stable"`, and this job's `working-directory: starkc` means every bare `cargo`
      # here honours that file rather than whatever the toolchain action made default -- which is
      # how the first attempt reached "the 'miri' component ... is not available for the
      # 'stable-x86_64-unknown-linux-gnu' toolchain". An explicit `+toolchain` overrides the file.
      #
      # The toolchain name must stay in step with the `toolchain:` above.
      - name: Miri over the slot primitives
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-ignore-leaks
        run: "cargo +nightly-2026-07-20 miri test -p stark-runtime --lib slot:: -- --nocapture"

  # §16.4: two green corpus jobs are not agreement, for the same reason two green platform jobs are
  # not. `if: always()` for the same reason as the C6.4 comparison: a skipped comparison is an
  # absence a reader has to interpret, not a report.
  c65-tier1-comparison:
    name: C6.5 corpus tier-1 agreement
    needs: c65-corpus
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: c65-evidence-*
          path: evidence
          merge-multiple: true
        continue-on-error: true
      - name: Compare corpus records
        run: |
          mkdir -p evidence
          python3 starkc/scripts/compare-c65-evidence.py \
            evidence/macos-arm64-summary.json evidence/linux-x64-summary.json \
            --per-case evidence/macos-arm64-per-case.json evidence/linux-x64-per-case.json \
            --output evidence/c65-tier1-agreement.md
      - name: Upload agreement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c65-tier1-agreement
          path: evidence/

  # §10.4: two green jobs are not agreement. This is the job that compares them.
  #
  # `if: always()` is load-bearing, not defensive. Without it a failed qualification job would
  # SKIP this one, and a skipped job is not a report — it is an absence that a reader has to
  # interpret. §10.4 forbids letting workflow-level skipping stand in for an explicit TIER-1
  # DISAGREEMENT. So the comparison runs after success, failure or cancellation of either matrix
  # job, downloads whatever evidence exists, and the comparator itself reports a missing or
  # invalid record as a disagreement with a named cause.
  c64-tier1-comparison:
    name: C6.4 tier-1 agreement
    needs: c64-qualification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `if-no-files-found: ignore`: when both qualification jobs fail before uploading, the
      # comparison must still run and say so, rather than failing on the download step with a
      # message about artifacts.
      - uses: actions/download-artifact@v4
        with:
          pattern: c64-evidence-*
          path: evidence
          merge-multiple: true
        continue-on-error: true
      - name: Compare Tier-1 records
        id: compare
        run: |
          mkdir -p evidence
          python3 starkc/scripts/compare-c64-evidence.py \
            evidence/macos-arm64.json evidence/linux-x64.json \
            --out evidence/qualification-summary.md
      # Runs even when the comparison exited non-zero, so the disagreement report is published
      # and uploaded rather than only appearing in a failed step's log.
      - name: Publish summary
        if: always()
        run: |
          if [ -f evidence/qualification-summary.md ]; then
            cat evidence/qualification-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparator produced no summary at all." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c64-qualification-summary
          path: evidence/qualification-summary.md
          if-no-files-found: warn

  # §36: Windows is Tier-2. This job gathers the gap report's raw material and must NOT gate a
  # Tier-1 claim, which is why it is `continue-on-error` and why its artifact is named a gap
  # report rather than evidence.
  c64-windows-gap:
    name: C6.4 windows tier-2 gap probe
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: C6.4 platform suite on Windows
        shell: bash
        run: cargo test --test c64_platform_matrix -- --nocapture 2>&1 | tee "$RUNNER_TEMP/windows-c64.log"
      - name: Upload gap probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64-windows-gap-probe
          path: ${{ runner.temp }}/windows-c64.log

  release-package-smoke:
    name: release package smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: starkc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: Build release package
        run: python scripts/build-release.py --skip-tests
      # WP-C6.4 (§10.6): the installed smoke runs with STARK_REQUIRE_INSTALLED_RUNTIME=1.
      #
      # Without it this job could pass for the wrong reason. The source-checkout runtime fallback
      # is compiled into the binary (`env!("CARGO_MANIFEST_DIR")`), the runner's checkout is still
      # on disk at that exact path, and so a BROKEN INSTALL LAYOUT would be rescued silently and
      # the job would stay green. §10.6 is explicit that "a pass while the source checkout remains
      # an accidental dependency is invalid". With the variable set, discovery of the installed
      # runtime is the only path that can succeed.
      - name: Install and smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          STARK_REQUIRE_INSTALLED_RUNTIME: "1"
        run: |
          archive="$(find target/packages -maxdepth 1 -name 'stark-*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/stark-package"
          tar -xzf "$archive" -C "$RUNNER_TEMP/stark-package"
          package_root="$(find "$RUNNER_TEMP/stark-package" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          "$package_root/install.sh" --prefix "$RUNNER_TEMP/stark-install"
          "$RUNNER_TEMP/stark-install/bin/stark" --help
          # The installed layout is VERSIONED: `lib/stark/current` -> `versions/<v>`, with the
          # payload beneath it. Asserting the old flat path here is what broke this job when the
          # installer changed, and `stark doctor` is the check that does not have to be kept in
          # step by hand -- it reads the manifest and re-hashes every file the package shipped.
          "$RUNNER_TEMP/stark-install/bin/stark" doctor
          test -f "$RUNNER_TEMP/stark-install/lib/stark/current/lib/stark/stark-runtime/src/lib.rs"
          mkdir -p "$RUNNER_TEMP/external-toolchain-package/src"
          cat > "$RUNNER_TEMP/external-toolchain-package/starkpkg.json" <<'JSON'
          {"name":"external-app","version":"0.1.0","entry":"src/main.stark","capabilities":["filesystem-read","filesystem-write"],"dependencies":{"stark_io":{"package":"stark-io","version":"0.1.0"}}}
          JSON
          cat > "$RUNNER_TEMP/external-toolchain-package/src/main.stark" <<'STARK'
          fn main() { println("toolchain-package-ok"); }
          STARK
          (
            cd "$RUNNER_TEMP/external-toolchain-package"
            "$RUNNER_TEMP/stark-install/bin/stark" check --offline
            "$RUNNER_TEMP/stark-install/bin/stark" build --offline
            "$RUNNER_TEMP/stark-install/bin/stark" build --locked --offline
            ./target/stark/debug/external-app
          )
          (
            cd tests/fixtures/c5-native-workspace/app
            "$RUNNER_TEMP/stark-install/bin/stark" run
            "$RUNNER_TEMP/stark-install/bin/stark" build --locked --offline
            ./target/stark/debug/app
          )
      # The negative half, and the one that makes the positive half mean something: with the
      # installed runtime REMOVED and the checkout still present, the same command must FAIL.
      # If it succeeded, the build above proved nothing about which runtime it used.
      - name: Installed runtime cannot fall back to the checkout (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          STARK_REQUIRE_INSTALLED_RUNTIME: "1"
        run: |
          test -d "$RUNNER_TEMP/stark-install/lib/stark/current/lib/stark/stark-runtime"
          mv "$RUNNER_TEMP/stark-install/lib/stark/current/lib/stark/stark-runtime" "$RUNNER_TEMP/runtime-hidden"
          test -f stark-runtime/Cargo.toml   # the checkout IS still here, at the compiled-in path
          set +e
          (
            cd tests/fixtures/c5-native-workspace/app
            "$RUNNER_TEMP/stark-install/bin/stark" build --locked --offline
          ) >"$RUNNER_TEMP/negative.out" 2>&1
          status=$?
          set -e
          mv "$RUNNER_TEMP/runtime-hidden" "$RUNNER_TEMP/stark-install/lib/stark/current/lib/stark/stark-runtime"
          cat "$RUNNER_TEMP/negative.out"
          if [ $status -eq 0 ]; then
            echo "FAIL: installed stark built with no installed runtime — it fell back to the checkout" >&2
            exit 1
          fi
          # Any non-zero exit would satisfy the check above, including one for an unrelated reason.
          # Requiring the runtime-missing diagnostic is what makes this a controlled experiment
          # rather than "something went wrong after we moved a directory".
          if ! grep -q "native runtime installation is missing" "$RUNNER_TEMP/negative.out"; then
            echo "FAIL: build failed (exit $status) but not for the missing installed runtime" >&2
            exit 1
          fi
          echo "installed stark refused to build without its installed runtime, for that reason (exit $status)"
      # The same two halves on Windows. The variable is set for the smoke and REMOVED afterwards
      # (in `finally`, so a thrown error still restores it) rather than left set for the rest of
      # the job, where it would silently change the behaviour of any later step.
      - name: Install and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem target/packages/stark-*.zip | Select-Object -First 1
          if (-not $archive) { throw "release archive was not produced" }
          $packageDir = Join-Path $env:RUNNER_TEMP "stark-package"
          Expand-Archive $archive.FullName -DestinationPath $packageDir
          $packageRoot = Get-ChildItem $packageDir -Directory | Select-Object -First 1
          $prefix = Join-Path $env:RUNNER_TEMP "stark-install"
          & (Join-Path $packageRoot.FullName "install.ps1") -Prefix $prefix -NoPathUpdate
          & (Join-Path $prefix "bin/stark.exe") --help
          # `doctor` on Windows is the regression guard for the hardcoded `bin/stark` lookup that
          # made install.ps1 reject a correct package.
          & (Join-Path $prefix "bin/stark.exe") doctor
          if ($LASTEXITCODE -ne 0) { throw "installed toolchain failed doctor" }
          if (-not (Test-Path (Join-Path $prefix "lib/stark/current/lib/stark/stark-runtime/src/lib.rs"))) {
            throw "installed native runtime is missing"
          }
          $env:STARK_REQUIRE_INSTALLED_RUNTIME = "1"
          $external = Join-Path $env:RUNNER_TEMP "external-toolchain-package"
          New-Item -ItemType Directory -Force (Join-Path $external "src") | Out-Null
          '{"name":"external-app","version":"0.1.0","entry":"src/main.stark","capabilities":["filesystem-read","filesystem-write"],"dependencies":{"stark_io":{"package":"stark-io","version":"0.1.0"}}}' | Set-Content -Encoding utf8 (Join-Path $external "starkpkg.json")
          'fn main() { println("toolchain-package-ok"); }' | Set-Content -Encoding utf8 (Join-Path $external "src/main.stark")
          Push-Location $external
          try {
            & (Join-Path $prefix "bin/stark.exe") check --offline
            if ($LASTEXITCODE -ne 0) { throw "installed toolchain package check failed" }
            & (Join-Path $prefix "bin/stark.exe") build --offline
            if ($LASTEXITCODE -ne 0) { throw "installed toolchain package build failed" }
            & (Join-Path $prefix "bin/stark.exe") build --locked --offline
            if ($LASTEXITCODE -ne 0) { throw "installed locked toolchain package build failed" }
            & (Join-Path $external "target/stark/debug/external-app.exe")
            if ($LASTEXITCODE -ne 0) { throw "installed toolchain package artifact failed" }
          } finally {
            Pop-Location
          }
          Push-Location tests/fixtures/c5-native-workspace/app
          try {
            & (Join-Path $prefix "bin/stark.exe") run
            if ($LASTEXITCODE -ne 0) { throw "installed stark run failed" }
            & (Join-Path $prefix "bin/stark.exe") build --locked --offline --verbose
            if ($LASTEXITCODE -ne 0) { throw "installed stark build failed" }
            & ".\target\stark\debug\app.exe"
            if ($LASTEXITCODE -ne 0) { throw "installed native artifact failed" }
          } finally {
            Pop-Location
            Remove-Item Env:\STARK_REQUIRE_INSTALLED_RUNTIME -ErrorAction SilentlyContinue
          }
      - name: Installed runtime cannot fall back to the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "stark-install"
          $runtime = Join-Path $prefix "lib/stark/current/lib/stark/stark-runtime"
          $hidden = Join-Path $env:RUNNER_TEMP "runtime-hidden"
          if (-not (Test-Path $runtime)) { throw "installed runtime was expected to exist" }
          Move-Item $runtime $hidden
          # The checkout IS still present at the path compiled into the binary.
          if (-not (Test-Path "stark-runtime/Cargo.toml")) { throw "checkout runtime is missing" }
          $env:STARK_REQUIRE_INSTALLED_RUNTIME = "1"
          Push-Location tests/fixtures/c5-native-workspace/app
          try {
            $output = & (Join-Path $prefix "bin/stark.exe") build --locked --offline 2>&1
            $status = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
          } finally {
            Pop-Location
            Remove-Item Env:\STARK_REQUIRE_INSTALLED_RUNTIME -ErrorAction SilentlyContinue
            Move-Item $hidden $runtime
          }
          if ($status -eq 0) {
            throw "installed stark built with no installed runtime -- it fell back to the checkout"
          }
          # As on Unix: a non-zero exit alone would also be satisfied by an unrelated failure.
          if ($output -join "`n" -notmatch "native runtime installation is missing") {
            throw "build failed (exit $status) but not for the missing installed runtime"
          }
          Write-Host "installed stark refused to build without its installed runtime, for that reason (exit $status)"
          # REQUIRED, and the reason is subtle: GitHub appends `exit $LASTEXITCODE` to a pwsh step,
          # and $LASTEXITCODE is still 1 from the build we DELIBERATELY made fail. Without this the
          # step reports failure having asserted exactly what it set out to assert — the first run
          # of this check logged "refused ... (exit 1)" and then failed the job on that same 1.
          # The bash branch does not need it: its last command is the echo, which exits 0.
          exit 0

  fixture-conformance:
    name: spec fixture conformance
    runs-on: ubuntu-latest
    # Required-green since WP1.4 (PLAN.md: Gate 1 exit criterion).
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth 1): the WP-C1.6 evidence report's
          # `last_verified_commit` column is computed via `git log -- <path>` per rule, which
          # needs real history to search, not just the tip commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - name: Spec regeneration is in sync with the normative sources (C3-ENTRY baseline)
        # Markdown only — HTML/PDF regeneration via pandoc/weasyprint is not byte-reproducible.
        run: python3 STARKLANG/tools/build-core-spec.py --check
      - name: Fixture extraction is in sync with the spec
        run: |
          STARKLANG/tools/extract-spec-examples.sh /tmp/fixtures-check > /dev/null
          # manifest.toml (WP1.3 triage) is hand-maintained, not extracted
          diff -r --exclude=manifest.toml STARKLANG/tests/spec-fixtures /tmp/fixtures-check
      - name: Manifest-driven spec conformance
        run: |
          cd starkc
          cargo test --test conformance
      - name: Coverage database is internally consistent
        run: python3 starkc/scripts/check-conformance.py
      - name: Generate conformance evidence report (WP-C1.6)
        run: |
          python3 starkc/scripts/generate-conformance-report.py --format=json --out=conformance-report.json
          python3 starkc/scripts/generate-conformance-report.py --format=markdown --out=conformance-report.md
          cat conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence-report
          path: |
            conformance-report.json
            conformance-report.md

  # ---------------------------------------------------------------- WP-C7 / P1 --
  #
  # The P1 native HTTP/JSON REST workload, built and EXECUTED on all three Tier-1 platforms.
  #
  # This job exists because P1's Linux and Windows rows were framed as manual runs and had stayed
  # unrun, holding Gate C7 open on qualification. They were never a research problem — CI already
  # covers all three platforms, and the workload's only portability gaps were a missing `.exe`
  # suffix and a `python3` that Windows runners do not have.
  #
  # It builds AND runs. `stark-json`'s native evidence was recorded on a successful `stark build`
  # whose binary had never been executed; when it finally was, it aborted immediately on a real
  # compiler defect. A build step alone would repeat that mistake at Tier-1 scale.
  p1-rest-workload:
    name: C7 P1 REST workload (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            exe: ''
          - name: macos-arm64
            os: macos-14
            exe: ''
          - name: windows-x64
            os: windows-latest
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    # `bash` on every platform so one relative path works everywhere, and `matrix.exe` rather than
    # relying on a shell to guess the suffix. The harness scripts resolve `.exe` themselves.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the compiler
        working-directory: starkc
        run: cargo build --release --bin stark
      # Pure-STARK behaviour, with no host capabilities: proves the application logic independently
      # of the provider path, so a failure below can be attributed to one or the other.
      - name: Pure STARK tests
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: python scripts/pure_tests.py
      - name: Native build (debug)
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: ../../../target/release/stark${{ matrix.exe }} build --no-build-cache --verbose
      # 24 raw HTTP exchanges over loopback, every response compared byte-for-byte including
      # headers and length, then a bounded clean exit. This is the step that makes the row
      # "executed" rather than "built".
      - name: Native execution — 24 byte-exact HTTP cases (debug)
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: python scripts/e2e.py --profile debug
      - name: Native build (release)
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: ../../../target/release/stark${{ matrix.exe }} build --release --no-build-cache --verbose
      - name: Native execution — 24 byte-exact HTTP cases (release)
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: python scripts/e2e.py --profile release
      - name: Formatting
        working-directory: starkc/tests/workloads/c7-p1-rest
        run: ../../../target/release/stark${{ matrix.exe }} fmt --check

  first-party-package-qualification:
    name: first-party package qualification (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            exe: ''
          - name: macos-arm64
            os: macos-14
            exe: ''
          - name: windows-x64
            os: windows-latest
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            starkc
            packages/stark-tls/native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the compiler
        working-directory: starkc
        run: cargo build --release --bin stark
      # **The generated crate is built `--offline`** (WP-C5 §11.3's no-network rule), so every
      # registry crate a linked PROVIDER needs must already be in this job's cargo home. Only
      # `packages/stark-tls/native` has registry dependencies — rustls, aws-lc-rs, rustls-native-certs — and
      # without this the gate fails in about a second with "the STARK native backend generated a
      # crate that Cargo could not build" and no further detail.
      #
      # It passed locally throughout HC9 and HC10 because a developer's registry already holds
      # these from building the provider crate itself. This job's does not: `rust-cache` is keyed
      # per workspace and the C7.8 workflow that builds the TLS provider is a DIFFERENT job.
      - name: Pre-fetch native provider dependencies
        run: cargo fetch --manifest-path packages/stark-tls/native/Cargo.toml
      - name: Qualify JSON, URL, Base64, Hex, and UUID packages
        run: |
          python3 starkc/scripts/qualify-first-party-packages.py \
            --stark "starkc/target/release/stark${{ matrix.exe }}" \
            --repo-root "$PWD" \
            --exe-suffix "${{ matrix.exe }}"

  # ------------------------------------------------------------------------------------------
  # WP-DEV-134-139 §10.2: the EXTERNAL task-shaped suite, run against built release artifacts.
  #
  # Why a separate repository rather than another directory here. The fixture corpus and the
  # generated C6 corpus both grow from this compiler's own model of what programs look like. The
  # sample suite grew from TASKS -- sort a vector, walk a graph, parse an expression -- and that
  # independence is why it found six defects (CD-334) the in-tree suites did not. Absorbing it
  # would reorganise it around compiler subsystems and destroy the property that makes it useful.
  #
  # PINNED BY SHA, deliberately, not tracking a branch. §10.3: when a compiler fix changes an
  # external task's expected outcome, the suite's manifest must be updated and THIS PIN must move
  # to the commit carrying that update, in the same logical change set. A floating `main` would
  # let the suite drift green or red for reasons unrelated to the commit under test, which is
  # exactly the confusion the pin prevents.
  #
  # It runs the BUILT artifacts, never `cargo run`, so what is tested is what would ship.
  # ------------------------------------------------------------------------------------------
  external-sample-suite:
    name: External sample suite (pinned)
    runs-on: ubuntu-latest
    env:
      # Moving this pin is a deliberate act. See §10.3 above.
      SAMPLES_REPO: navraj007in/stark-samples
      SAMPLES_SHA: b3b28e757f38d691e7309f168d1209e28ac459af
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starkc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release artifacts under test
        working-directory: starkc
        run: cargo build --release --bin stark --bin starkc
      - name: Check out the sample suite at its pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SAMPLES_REPO }}
          ref: ${{ env.SAMPLES_SHA }}
          path: external-samples
      - name: Confirm the pin resolved to the commit we asked for
        # `ref:` accepts a branch too, so an accidental branch name would silently float. This
        # fails loudly instead.
        working-directory: external-samples
        run: |
          actual="$(git rev-parse HEAD)"
          echo "pinned:   $SAMPLES_SHA"
          echo "resolved: $actual"
          if [ "$actual" != "$SAMPLES_SHA" ]; then
            echo "::error::the sample suite did not resolve to the pinned commit"
            exit 1
          fi
      - name: Run the suite against the built artifacts
        working-directory: external-samples
        run: |
          python3 verify.py \
            --stark "$GITHUB_WORKSPACE/starkc/target/release/stark" \
            --starkc "$GITHUB_WORKSPACE/starkc/target/release/starkc" \
            --results "$GITHUB_WORKSPACE/external-suite-results.json"
      - name: Upload the suite's manifest and results as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-sample-suite-results
          path: |
            external-suite-results.json
            external-samples/manifest.json
          if-no-files-found: warn

  # ------------------------------------------------------------------------------------------
  # The single required check for branch protection.
  #
  # Protection could name all eleven jobs above, but three of them are matrices, so the real
  # check names are generated (`fmt, clippy, test (linux-x64)` and so on) and change whenever a
  # platform is added or renamed. A rule pinned to generated names fails open: a renamed job is
  # simply not found, and GitHub reports the rule satisfied because nothing it requires failed.
  #
  # This job depends on every other and is the only name protection needs to know. Adding a job
  # means adding one line to `needs:` -- and forgetting to is visible here, not silently
  # unprotected.
  # ------------------------------------------------------------------------------------------
  ci-complete:
    name: CI complete
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - c64-qualification
      - c65-corpus
      - c65-mutation-controls
      - dev160-miri
      - c65-tier1-comparison
      - c64-tier1-comparison
      - c64-windows-gap
      - release-package-smoke
      - fixture-conformance
      - p1-rest-workload
      - first-party-package-qualification
      - external-sample-suite
    steps:
      - name: Verify every job succeeded
        # `needs.*.result` is `success`, `failure`, `cancelled` or `skipped`. Anything other than
        # success fails this gate: `if: always()` means this job runs even when a dependency
        # failed, so without the explicit check it would report success on a red run.
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::at least one CI job failed"
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::at least one CI job was cancelled"
            exit 1
          fi
          echo "all jobs succeeded"
