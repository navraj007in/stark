name: C7.8 Native Capabilities

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  provider-metadata:
    name: provider metadata/unit/resource/loopback (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/stark-time/native
            starkc/stark-provider-abi
            packages/stark-env/native
            packages/stark-file/native
            packages/stark-net/native
            packages/stark-tls/native
      - name: provider-metadata stark-time
        run: cargo test --manifest-path packages/stark-time/native/Cargo.toml provider_metadata
      - name: provider-metadata stark-env
        run: cargo test --manifest-path packages/stark-env/native/Cargo.toml metadata
      - name: provider-metadata stark-file
        run: cargo test --manifest-path packages/stark-file/native/Cargo.toml metadata
      - name: provider-metadata stark-net
        run: cargo test --manifest-path packages/stark-net/native/Cargo.toml metadata
      # HC9. `manifest` rather than `metadata`: this provider's agreement test is named for the
      # SHIPPED manifest it reads, because that is the authority (P0.2) rather than a second
      # literal in the crate.
      - name: provider-metadata stark-tls
        run: cargo test --manifest-path packages/stark-tls/native/Cargo.toml manifest
      - name: provider-unit
        run: |
          cargo test --manifest-path packages/stark-env/native/Cargo.toml
          cargo test --manifest-path packages/stark-file/native/Cargo.toml
      - name: provider-resource-lifecycle
        run: cargo test --manifest-path packages/stark-file/native/Cargo.toml create_write_complete_and_read_back
      - name: provider-loopback
        run: cargo test --manifest-path packages/stark-net/native/Cargo.toml
      # HC9 — the TLS certificate matrix, the handshake bounds and the transfer lifecycle. Runs on
      # all three platforms: certificate verification is the one place where "it worked on my
      # machine" is least acceptable, and aws-lc-rs needs a C toolchain on each (CD-361 §6).
      - name: provider-tls
        run: cargo test --manifest-path packages/stark-tls/native/Cargo.toml
      - name: stark-time-e2e
        run: |
          python -c "import tomllib; m=tomllib.load(open('c78/capabilities.toml','rb')); assert m['stark_time']['native_e2e']=='implemented'"
          cargo test --manifest-path starkc/Cargo.toml --test a10_stark_time_e2e
      - name: provider-api through starkc build
        run: cargo test --manifest-path starkc/Cargo.toml --test c788_starkc_build
      - name: bounded C6 native non-regression
        run: |
          cargo test --manifest-path starkc/Cargo.toml --test native_c6_2_generics_traits c62a_bounded_generic_calls_the_bound_method
          cargo test --manifest-path starkc/Cargo.toml --test native_c5_4_linkage a_cross_package_program_links_and_runs_natively
      - name: args-env-e2e implemented
        run: python -c "import tomllib; m=tomllib.load(open('c78/capabilities.toml','rb')); assert m['stark_env']['native_e2e']=='implemented'"
      - name: file-e2e implemented
        run: python -c "import tomllib; m=tomllib.load(open('c78/capabilities.toml','rb')); assert m['stark_file']['native_e2e']=='implemented'"
      - name: tcp-e2e pending
        run: |
          python -c "import tomllib; m=tomllib.load(open('c78/capabilities.toml','rb')); assert m['stark_net']['native_e2e']=='implemented'"
          python -c "import tomllib; m=tomllib.load(open('c78/capabilities.toml','rb')); assert m['stark_net']['source_build_e2e']=='implemented'"
      - name: tcp resource lifecycle executes
        # The evidence behind the two assertions above: a STARK program that connects and is closed
        # by MIR's Drop, built through `starkc build` and run. Asserted here so the record cannot
        # claim "implemented" while the test that justifies it is absent or failing.
        run: cargo test --manifest-path starkc/Cargo.toml --test c788_lifecycle_e2e
      - name: c7.8-qualification-record
        run: python c78/qualification/make-record.py --platform "${{ matrix.name }}" --commit "${{ github.sha }}" --output "${{ runner.temp }}/c78/${{ matrix.name }}.json"
      - name: Upload C7.8 record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c78-record-${{ matrix.name }}
          path: ${{ runner.temp }}/c78/

  c78-qualification-record:
    name: C7.8 qualification record comparison
    needs: provider-metadata
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: c78-record-*
          path: c78-records
          merge-multiple: true
      - name: Compare C7.8 records
        run: python c78/qualification/compare-records.py --commit "$GITHUB_SHA" c78-records/*.json
