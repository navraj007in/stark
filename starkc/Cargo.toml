[package]
name = "starkc"
version = "0.1.0"
edition = "2021"
default-run = "starkc"
description = "Compiler for the STARK Core v1 language"
license = "MIT"
rust-version = "1.85"

# WP-C5.1b: `starkc` is now the workspace root, with `stark-runtime` (the crate every
# generated-Rust native binary links, WP-C5-ENTRY.md §9) as a sibling member. Kept nested here
# rather than at the repo root so CI's existing `working-directory: starkc` continues to cover
# it with no workflow changes.
[workspace]
members = [".", "stark-provider-abi", "stark-runtime"]

[dependencies]
sha2 = { version = "0.11.0", default-features = false }
stark-provider-abi = { path = "stark-provider-abi" }
stark-runtime = { path = "stark-runtime" }

[dev-dependencies]
# Already a normal dependency; declared here so integration tests can hash
# opt-in Gate 5 fixtures. Does not expand the compiler's dependency surface.
sha2 = { version = "0.11.0", default-features = false }

# --- WP-C3.3 direct-backend spike (Gate C3): RETIRED 2026-08-06 ---
# The Cranelift dev-dependencies (cranelift-codegen/-frontend/-module/-object, target-lexicon)
# and `tests/spike_cranelift.rs` lived here to compare a direct code generator against the
# generated-Rust spike. Gate C3 selected generated Rust (`SELECT-GENERATED`, WP-C3.4, CE5,
# 2026-07-19), which is the condition the spike's own note set for their removal. Retired under
# WP-ARCHITECTURE-STABILIZATION Sprint 1; measurements survive in
# `docs/compiler/spikes/WP-C3.3-direct-cranelift.md`.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
