# WP-C6.5 differential corpus manifest (§9.2).
#
# One `[[case]]` table per case, in ASCENDING case_id order — enumeration order is part of the
# contract (§9.3 "nondeterministic ordering" is a rejection), so the manifest is sorted and the
# validator enforces it rather than trusting whoever edits this file next.
#
# The reader is a deliberately small strict parser for exactly the subset used here
# (`tests/support/corpus.rs`, per §9.4 option 2): comments, `[[case]]` headers, and
# `key = "string"` / `key = ["a", "b"]` / `key = true` values. No nesting, no inline tables, no
# numbers. Anything outside that subset — including an unknown key — is an error, not an ignored
# line, because a silently ignored key is a case attribute nobody is checking.
#
# Every field is documented in `README.md`. Fields that carry no invariant for a given case are
# omitted rather than written empty, EXCEPT where a rule requires presence (a generated case must
# carry seed/version/template; a metamorphic member must carry family/group; a trap case must
# carry its expected category).

