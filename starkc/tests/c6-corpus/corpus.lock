# WP-C6.5 differential corpus lock (§9.5). Generated by `generate.py --lock`.
#
# Header `key = value` lines, then one `<sha256>  <relative/path>` line per corpus source,
# sorted by path. This is NOT `exec_snapshots/corpus.lock`: the inherited frozen execution
# corpus is preserved as its own artifact and is not absorbed into this one (§3.2).
#
# A corpus change requires regenerating this file AND bumping corpus_version (§9.6):
# patch = metadata only, minor = new cases/templates/families, major = incompatible
# manifest, protocol or expectation model. `c6_corpus_manifest.rs` enforces the version
# line against a constant, so a regeneration cannot quietly redefine the baseline.
#
# corpus_version 0.1.0 (WP-C6.5-2, 2026-07-26, CD-152): the corpus is created with the
# retained DEV-111/DEV-112 entry-contract cases, so the machinery locks real files rather
# than being vacuously green on an empty tree.
# corpus_version 0.2.0 (WP-C6.5-3, 2026-07-26, CD-153): the thirteen §10.3 adversarial
# sentinels, each pinning its observation in the manifest so it fails under the LIKELY WRONG
# implementation rather than only under engine disagreement. Minor: new cases, no change to
# any existing source or expectation.
# corpus_version 0.3.0 (WP-C6.5-4, 2026-07-26, CD-155): the deterministic generator and its
# 70 cases across 15 templates. `generator_sha256` and `templates_sha256` pin the producer as
# well as the product -- regenerating with a changed template changes the lock. Minor.
# corpus_version 0.4.0 (WP-C6.5-6, 2026-07-26, CD-157): 20 metamorphic groups over ten of the
# twelve §13.1 families, 40 member cases. M08/M09 transform a package graph and are absent
# until §15 rather than approximated single-file. Minor.
# corpus_version 0.9.0 (batch, 2026-07-27, CD-167): R-04/R-05. M08 (workspace relocation)
# and M09 (dependency declaration reorder) are BUILT, reaching §13.2's floor of 24 groups /
# 48 members across all twelve families. Both were recorded as unbuildable -- 'every corpus
# case is single-file until §15' -- which stopped being true when DEV-113/DEV-114 added
# package cases, and DEV-114's fix is what made M09 comparable at all. Four new package
# member trees. Minor.
# corpus_version 0.8.0 (batch, 2026-07-27, CD-165): R-07. Eleven matrix rows the generated
# cases genuinely exercise are now CITED by the templates that exercise them, verified
# against the emitted sources. Paired with the matrix correction of 36 unearned `->T##`
# arrows and a test that reads every remaining arrow. Metadata only -- no case source
# changed -- but the coverage claim did, so: minor.
# corpus_version 0.7.0 (batch, 2026-07-27, CD-165): R-01/R-09/R-11/R-13. T16 is EXHAUSTIVE
# (its dimension space IS the coverage claim, so a sampling budget must not truncate it) and
# gains UnwrapNone/UnwrapErr -- 10 of 10 admitted trap categories. The loop bound is enforced,
# case-ID collisions are detected, and metamorphic members no longer cite family ids as if
# they were matrix rows. Minor.
# corpus_version 0.6.0 (batch, 2026-07-27, CD-164): the three approved decision packets.
# DEV-113 makes package trap provenance logical, which admits the dependency-trap case §15.1
# requires; the CD-150 CE3 adds TrapCategory::InvalidExitStatus (MIR amendment A7) and native
# emission for every PROC-MAIN-001 entry signature, so the entry cases become three-engine and
# the out-of-range status joins as a trap case. Trap coverage 5 of 9 -> 7 of 9. Minor.
# corpus_version 0.9.0 (batch, 2026-07-27, CD-167): R-04/R-05. M08 (workspace relocation)
# and M09 (dependency declaration reorder) are BUILT, reaching §13.2's floor of 24 groups /
# 48 members across all twelve families. Both were recorded as unbuildable -- 'every corpus
# case is single-file until §15' -- which stopped being true when DEV-113/DEV-114 added
# package cases, and DEV-114's fix is what made M09 comparable at all. Four new package
# member trees. Minor.
# corpus_version 0.8.0 (batch, 2026-07-27, CD-165): R-07. Eleven matrix rows the generated
# cases genuinely exercise are now CITED by the templates that exercise them, verified
# against the emitted sources. Paired with the matrix correction of 36 unearned `->T##`
# arrows and a test that reads every remaining arrow. Metadata only -- no case source
# changed -- but the coverage claim did, so: minor.
# corpus_version 0.7.0 (batch, 2026-07-27, CD-165): R-01/R-09/R-11/R-13. T16 is EXHAUSTIVE
# (its dimension space IS the coverage claim, so a sampling budget must not truncate it) and
# gains UnwrapNone/UnwrapErr -- 10 of 10 admitted trap categories. The loop bound is enforced,
# case-ID collisions are detected, and metamorphic members no longer cite family ids as if
# they were matrix rows. Minor.
# corpus_version 0.6.0 (batch, 2026-07-27, CD-164): the three approved decision packets.
# DEV-113 makes package trap provenance logical, which admits the dependency-trap case §15.1
