# "implemented" since A12 (CD-265). It read "pending" while repeated connect/release was ignored:
# that case found a real compiler defect rather than a test problem, and the flag stayed honest
# about it until the defect was fixed rather than until the test was made to pass.
lifecycle_set = "implemented"
